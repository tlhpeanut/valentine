<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi em, Valentine của anh</title>
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Parisienne&family=Great+Vibes&family=Poppins:wght@300;500&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="bg-overlay"></div>
    <div id="background-effects"></div>
    <div id="page1" class="page">
        <h1 class="main-title">Happy Valentine's Day My Love</h1>
        <div class="container">
            <div class="envelope-wrapper">
                <div class="envelope">
                    <div class="front flap"></div>
                    <div class="front pocket"></div>
                    <div class="wax-seal"></div>
                    <div class="letter">
                        <div class="text-content">
                            <strong>Dear Mai Love!</strong>
                            <p>
                                Cảm ơn em đã bước vào cuộc đời anh mang theo sự dịu dàng và ấm áp và làm cho cuộc sống
                                anh thêm hồng hơn.<br>
                                Hi vọng chúng ta sẽ luôn mãi nắm tay nhau dù cho có thế nào...❤️
                            </p>
                        </div>
                    </div>
                    <div class="hearts">
                        <div class="one"></div>
                        <div class="two"></div>
                        <div class="three"></div>
                        <div class="four"></div>
                        <div class="five"></div>
                    </div>
                </div>
            </div>
            <div class="reset">
                <button id="open">Open Letter <span class="heart-icon">♥</span></button>
            </div>
        </div>
    </div>

    <div id="page2" class="page hidden">
        <div class="bg-image"></div>
        <div class="content">
            <div class="decor-corner top-left">♥</div>
            <div class="decor-corner top-right">♥</div>
            <div class="decor-corner bottom-left">♥</div>
            <div class="decor-corner bottom-right">♥</div>
            <p class="quote">"You are the answer I never knew I was whispering for in every prayer"</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
